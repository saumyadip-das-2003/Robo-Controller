<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ROBO — Gesture Robot Controller</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;700&display=swap');
:root {
  --bg: #05050d;
  --surface: #0d0d1a;
  --border: #1a1a2e;
  --accent: #00ffaa;
  --accent2: #0088ff;
  --warn: #ff3355;
  --voice: #aa44ff;
  --text: #dde0f0;
  --muted: #44445a;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── WELCOME SCREEN ── */
#welcome-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity .8s ease;
}
#welcome-screen.hide { opacity: 0; pointer-events: none; }
.robo-logo {
  font-family: 'Orbitron', monospace;
  font-size: 72px; font-weight: 900;
  color: var(--accent);
  letter-spacing: 16px;
  animation: pulse 2.5s ease-in-out infinite;
  margin-bottom: 8px;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.robo-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted);
  letter-spacing: 4px; margin-bottom: 50px;
}
.welcome-msg {
  font-size: 15px; color: var(--text);
  text-align: center; margin-bottom: 28px; opacity: .75; line-height: 1.6;
}
.ip-setup {
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  width: 100%; max-width: 300px;
  padding: 0 20px; margin-bottom: 28px;
}
.ip-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; }
.ip-setup input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px; padding: 10px 14px;
  outline: none; text-align: center;
  transition: border-color .2s;
}
.ip-setup input:focus { border-color: var(--accent); }
.ip-setup input::placeholder { color: var(--muted); font-size: 12px; }
.start-btn {
  font-family: 'Orbitron', monospace;
  font-size: 16px; font-weight: 700;
  letter-spacing: 4px;
  color: #000;
  background: var(--accent);
  border: none; border-radius: 4px;
  padding: 14px 40px;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
}
.start-btn:active { transform: scale(.96); opacity: .8; }

/* scanlines */
.scanlines {
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,170,.012) 2px, rgba(0,255,170,.012) 4px);
  pointer-events: none; z-index: 200;
}

/* ── CONTROL UI ── */
#control-ui {
  display: flex; flex-direction: column;
  height: 100%; opacity: 0;
  transition: opacity .8s ease;
  pointer-events: none;
}
#control-ui.show { opacity: 1; pointer-events: all; }

header {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.hdr-logo { font-family: 'Orbitron', monospace; font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: 4px; }
.hdr-right { display: flex; align-items: center; gap: 8px; }
.mode-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; padding: 3px 8px;
  border-radius: 20px;
  border: 1px solid var(--muted); color: var(--muted);
  transition: all .3s;
}
.mode-badge.slow { border-color: var(--accent2); color: var(--accent2); }
.mode-badge.fast { border-color: #ffaa00; color: #ffaa00; }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); transition: background .3s; }
.conn-dot.on { background: var(--accent); }

.cam-wrap { position: relative; flex: 1; overflow: hidden; background: #000; }
video, canvas { position: absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
video  { transform: scaleX(-1); }
canvas { transform: scaleX(-1); }

.g-badge {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.75); border: 1px solid var(--muted);
  border-radius: 20px; padding: 5px 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  white-space: nowrap; transition: all .2s; z-index: 10;
}
.g-badge.active { border-color: var(--accent); color: var(--accent); }
.g-badge.locked { border-color: var(--warn);   color: var(--warn);   }
.g-badge.calib  { border-color: #ffaa00;        color: #ffaa00;       }

/* Voice feedback */
.v-badge {
  position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
  background: rgba(10,0,20,.85); border: 1px solid var(--voice);
  border-radius: 20px; padding: 4px 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--voice);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  white-space: nowrap; z-index: 10; opacity: 0; transition: opacity .3s;
}
.v-badge.show { opacity: 1; }

/* Gauges */
.gauges {
  position: absolute; bottom: 10px; left: 10px; right: 10px;
  display: flex; gap: 8px; z-index: 10;
}
.gauge {
  flex: 1; background: rgba(0,0,0,.7); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.g-label { font-size: 9px; letter-spacing: 2px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
.g-bar-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
.g-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .08s linear; }
.g-bar-fill.tilt { background: var(--accent2); }
.g-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--text); }
.speed-gauge {
  flex: 0 0 65px; background: rgba(0,0,0,.7); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 6px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.speed-val { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; color: var(--accent); }
.speed-lbl { font-size: 8px; color: var(--muted); font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; margin-top: 2px; }

/* Calibration overlay */
.calib-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,.75); z-index: 15; transition: opacity .5s;
}
.calib-overlay.hidden { opacity: 0; pointer-events: none; }
.calib-num { font-family: 'Orbitron', monospace; font-size: 64px; font-weight: 900; color: #ffaa00; }
.calib-msg { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #ffaa00; letter-spacing: 2px; margin-top: 8px; }

/* ── BOTTOM PANEL ── */
.panel {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  flex-shrink: 0;
}

/* Monitor */
.monitor {
  background: #000;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  line-height: 1.7;
  max-height: 72px;
  overflow-y: auto;
  scrollbar-width: none;
}
.monitor::-webkit-scrollbar { display: none; }
.monitor-line { display: flex; gap: 6px; }
.monitor-time { color: #444; flex-shrink: 0; }
.monitor-text { color: #00ff88; }
.monitor-text.warn  { color: #ffaa00; }
.monitor-text.error { color: #ff4466; }
.monitor-text.info  { color: #0088ff; }
.monitor-text.voice { color: #aa44ff; }

/* Metric bar */
.metric-bar {
  display: flex; gap: 6px;
  margin-bottom: 8px;
}
.metric {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  text-align: center;
}
.metric-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px; font-weight: 700;
  color: var(--accent);
  display: block;
}
.metric-val.warn  { color: #ffaa00; }
.metric-val.info  { color: var(--accent2); }
.metric-val.voice { color: var(--voice); }
.metric-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; color: var(--muted);
  letter-spacing: 1px;
}

/* Command buttons row */
.cmd-row { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
.cmd-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 1px;
  padding: 6px 9px; border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent; color: var(--muted);
  cursor: pointer; transition: all .15s; flex: 1;
}
.cmd-btn:active { background: var(--border); transform: scale(.95); color: var(--text); }

/* Action buttons row */
.action-row { display: flex; gap: 6px; margin-bottom: 8px; }
.action-btn {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 1px;
  padding: 8px 6px; border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent; color: var(--muted);
  cursor: pointer; transition: all .15s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.action-btn:active { transform: scale(.95); }
.action-btn.home-btn { border-color: var(--warn); color: var(--warn); }
.action-btn.log-btn  { border-color: var(--accent2); color: var(--accent2); }
.action-btn.mic-btn  {
  flex: 2;
  border-color: var(--voice); color: var(--voice);
  font-size: 11px;
}
.action-btn.mic-btn.recording {
  background: var(--voice); color: #fff;
  animation: mic-pulse .6s ease-in-out infinite;
}
@keyframes mic-pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

@supports (padding-bottom: env(safe-area-inset-bottom)) {
  .panel { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<div class="scanlines"></div>

<!-- WELCOME -->
<div id="welcome-screen">
  <div class="robo-logo">ROBO</div>
  <div class="robo-sub">GESTURE · VOICE · CONTROL</div>
  <div class="welcome-msg">Enter ESP32 IP and tap<br><strong>START ROBO</strong> to begin</div>
  <div class="ip-setup">
    <div class="ip-label">ESP32 IP ADDRESS</div>
    <input id="ip-input" type="text" inputmode="decimal" placeholder="192.168.x.x">
  </div>
  <button class="start-btn" onclick="bootROBO()">START ROBO</button>
</div>

<!-- CONTROL UI -->
<div id="control-ui">
  <header>
    <div class="hdr-logo">ROBO</div>
    <div class="hdr-right">
      <div class="mode-badge" id="mode-badge">NORMAL</div>
      <div class="conn-dot" id="conn-dot"></div>
    </div>
  </header>

  <div class="cam-wrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="g-badge" id="g-badge">NO HAND</div>
    <div class="v-badge" id="v-badge">—</div>

    <div class="calib-overlay hidden" id="calib-overlay">
      <div class="calib-num" id="calib-num">3</div>
      <div class="calib-msg">HOLD HAND STILL — CALIBRATING</div>
    </div>

    <div class="gauges">
      <div class="gauge">
        <div class="g-label">PAN</div>
        <div class="g-bar-bg"><div class="g-bar-fill" id="pan-bar" style="width:50%"></div></div>
        <div class="g-val" id="pan-val">90°</div>
      </div>
      <div class="gauge">
        <div class="g-label">TILT</div>
        <div class="g-bar-bg"><div class="g-bar-fill tilt" id="tilt-bar" style="width:50%"></div></div>
        <div class="g-val" id="tilt-val">90°</div>
      </div>
      <div class="speed-gauge">
        <div class="speed-val" id="speed-val">1x</div>
        <div class="speed-lbl">SPEED</div>
      </div>
    </div>
  </div>

  <div class="panel">

    <!-- MONITOR -->
    <div class="monitor" id="monitor">
      <div class="monitor-line"><span class="monitor-time">00:00</span><span class="monitor-text info">ROBO system ready. Enter IP and connect.</span></div>
    </div>

    <!-- METRICS BAR -->
    <div class="metric-bar">
      <div class="metric">
        <span class="metric-val" id="m-ping">—</span>
        <span class="metric-lbl">PING</span>
      </div>
      <div class="metric">
        <span class="metric-val info" id="m-fps">0</span>
        <span class="metric-lbl">FPS</span>
      </div>
      <div class="metric">
        <span class="metric-val" id="m-sent">0</span>
        <span class="metric-lbl">SENT</span>
      </div>
      <div class="metric">
        <span class="metric-val warn" id="m-mode">NORMAL</span>
        <span class="metric-lbl">MODE</span>
      </div>
      <div class="metric">
        <span class="metric-val" id="m-calib">—</span>
        <span class="metric-lbl">CALIB</span>
      </div>
    </div>

    <!-- COMMAND BUTTONS -->
    <div class="cmd-row">
      <button class="cmd-btn" onclick="execCmd('center')">CENTER</button>
      <button class="cmd-btn" onclick="execCmd('lock')">LOCK</button>
      <button class="cmd-btn" onclick="execCmd('unlock')">UNLOCK</button>
      <button class="cmd-btn" onclick="execCmd('slow')">SLOW</button>
      <button class="cmd-btn" onclick="execCmd('fast')">FAST</button>
      <button class="cmd-btn" onclick="execCmd('calibrate')">CALIB</button>
    </div>

    <!-- ACTION ROW: MIC + LOG + HOME -->
    <div class="action-row">
      <button class="action-btn mic-btn" id="talk-btn"
        ontouchstart="startTalk(event)" ontouchend="stopTalk(event)"
        onmousedown="startTalk(event)" onmouseup="stopTalk(event)">
        <i class="ti ti-microphone" style="font-size:16px"></i>
        HOLD TO TALK
      </button>
      <button class="action-btn log-btn" onclick="downloadLogs()">
        <i class="ti ti-download" style="font-size:14px"></i>
        LOG
      </button>
      <button class="action-btn home-btn" onclick="goHome()">
        <i class="ti ti-home" style="font-size:14px"></i>
        HOME
      </button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let ws = null, wsReady = false;
let sentCount = 0, frameCount = 0;
let lastPan = -1, lastTilt = -1;
let currentPan = 90, currentTilt = 90;
let isLocked = false, speedMode = 1;
let pingStart = 0;

// Tremor filter
const SMOOTH = 6;
let panBuf = Array(SMOOTH).fill(90);
let tiltBuf = Array(SMOOTH).fill(90);

// Calibration
let calibOffset = { dx: 0, dy: 0 };
let calibSamples = [], calibrating = false, calibDone = false;

// Voice
let rec = null, isRecording = false;

setInterval(() => { document.getElementById('m-fps').textContent = frameCount; frameCount = 0; }, 1000);

// ── Monitor ────────────────────────────────────────────────────────────────
let monitorStart = Date.now();
function addLog(text, type='') {
  const el  = document.getElementById('monitor');
  if (!el) return;
  const sec = Math.floor((Date.now() - monitorStart) / 1000);
  const mm  = String(Math.floor(sec/60)).padStart(2,'0');
  const ss  = String(sec%60).padStart(2,'0');
  const line = document.createElement('div');
  line.className = 'monitor-line';
  line.innerHTML = `<span class="monitor-time">${mm}:${ss}</span><span class="monitor-text ${type}">${text}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// ── Go Home ────────────────────────────────────────────────────────────────
function goHome() {
  if (ws) { ws.close(); }
  const cui = document.getElementById('control-ui');
  cui.classList.remove('show');
  cui.style.pointerEvents = 'none';
  const welcome = document.getElementById('welcome-screen');
  welcome.style.display = 'flex';
  setTimeout(() => welcome.classList.remove('hide'), 50);
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));
function smooth(buf, val) { buf.shift(); buf.push(val); return buf.reduce((a,b)=>a+b,0)/buf.length; }
function getAngles(lm) {
  const wrist=lm[0], mcp=lm[5];
  let dx = (mcp.x - wrist.x) - calibOffset.dx;
  let dy = (mcp.y - wrist.y) - calibOffset.dy;

  // Dead zone — if one axis is dominant, suppress the other
  // This prevents tilt from moving when you pan and vice versa
  const DEAD = 0.04; // increase this value for stricter separation
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  if (absDx > absDy + DEAD) {
    // Horizontal movement dominant — only pan, freeze tilt
    dy = 0;
  } else if (absDy > absDx + DEAD) {
    // Vertical movement dominant — only tilt, freeze pan
    dx = 0;
  }

  dx *= speedMode; dy *= speedMode;
  return { pan: clamp(90+dx*500,0,180), tilt: clamp(90-dy*500,0,180) };
}

// ── UI ─────────────────────────────────────────────────────────────────────
function setBadge(text, cls) {
  const b = document.getElementById('g-badge');
  b.textContent = text; b.className = 'g-badge '+(cls||'');
}
function updateGauges(pan, tilt) {
  document.getElementById('pan-val').textContent  = pan+'°';
  document.getElementById('tilt-val').textContent = tilt+'°';
  document.getElementById('pan-bar').style.width  = (pan/180*100).toFixed(1)+'%';
  document.getElementById('tilt-bar').style.width = (tilt/180*100).toFixed(1)+'%';
}
let vTimer = null;
function showVoice(text) {
  const b = document.getElementById('v-badge');
  b.textContent = text; b.classList.add('show');
  clearTimeout(vTimer); vTimer = setTimeout(()=>b.classList.remove('show'), 2500);
}
function setSpeedUI(m) {
  const badge = document.getElementById('mode-badge');
  const sv    = document.getElementById('speed-val');
  if (m==='slow')  { badge.className='mode-badge slow'; badge.textContent='SLOW';   sv.textContent='0.4x'; sv.style.color='var(--accent2)'; document.getElementById('m-mode').textContent='SLOW'; document.getElementById('m-mode').className='metric-val info'; }
  else if(m==='fast'){ badge.className='mode-badge fast'; badge.textContent='FAST'; sv.textContent='1.8x'; sv.style.color='#ffaa00'; document.getElementById('m-mode').textContent='FAST'; document.getElementById('m-mode').className='metric-val warn'; }
  else             { badge.className='mode-badge';      badge.textContent='NORMAL'; sv.textContent='1x';   sv.style.color='var(--accent)'; document.getElementById('m-mode').textContent='NORM'; document.getElementById('m-mode').className='metric-val'; }
}

// ── Commands ───────────────────────────────────────────────────────────────
function execCmd(cmd) {
  switch(cmd) {
    case 'center':
      currentPan=90; currentTilt=90;
      panBuf.fill(90); tiltBuf.fill(90);
      updateGauges(90,90); sendCommand(90,90,false);
      showVoice('ROBO: centering');
      addLog('CMD: center → pan=90° tilt=90°', 'info');
      break;
    case 'lock':
      isLocked=true; setBadge('LOCKED','locked');
      showVoice('ROBO: locked');
      addLog('CMD: locked at pan='+currentPan+'° tilt='+currentTilt+'°', 'warn');
      break;
    case 'unlock':
      isLocked=false; setBadge('UNLOCKED','active');
      showVoice('ROBO: unlocked');
      addLog('CMD: unlocked', 'info');
      break;
    case 'slow':
      speedMode=0.4; setSpeedUI('slow');
      showVoice('ROBO: slow mode');
      addLog('CMD: speed → SLOW (0.4x)', 'warn');
      break;
    case 'fast':
      speedMode=1.8; setSpeedUI('fast');
      showVoice('ROBO: fast mode');
      addLog('CMD: speed → FAST (1.8x)', 'warn');
      break;
    case 'normal':
      speedMode=1; setSpeedUI('normal');
      showVoice('ROBO: normal mode');
      addLog('CMD: speed → NORMAL (1x)');
      break;
    case 'stop':
      isLocked=true; sendCommand(currentPan,currentTilt,true);
      setBadge('STOPPED','locked'); showVoice('ROBO: stopped');
      addLog('CMD: STOP — position frozen', 'error');
      break;
    case 'calibrate':
      startCalibration(); showVoice('ROBO: calibrating...');
      addLog('CMD: calibration started...', 'info');
      break;
  }
}

function parseVoice(transcript) {
  const t = transcript.toLowerCase().trim();
  const words = t.split(/\s+/);
  const has = (w) => words.includes(w);

  if (has('center') || has('centre'))     execCmd('center');
  else if (has('unlock'))                  execCmd('unlock');
  else if (has('lock'))                    execCmd('lock');
  else if (has('slow'))                    execCmd('slow');
  else if (has('fast'))                    execCmd('fast');
  else if (has('normal'))                  execCmd('normal');
  else if (has('stop'))                    execCmd('stop');
  else if (has('calibrate') || has('calib')) execCmd('calibrate');
  else showVoice('ROBO: "' + t + '"?');
}

// ── Calibration ────────────────────────────────────────────────────────────
function startCalibration() {
  if (calibrating) return;
  calibrating = true; calibSamples = [];
  const overlay = document.getElementById('calib-overlay');
  const numEl   = document.getElementById('calib-num');
  overlay.classList.remove('hidden');
  setBadge('CALIBRATING...','calib');
  let count = 3; numEl.textContent = count;
  const tick = setInterval(() => {
    count--; numEl.textContent = count;
    if (count <= 0) {
      clearInterval(tick);
      if (calibSamples.length > 0) {
        calibOffset.dx = calibSamples.reduce((a,b)=>a+b.dx,0)/calibSamples.length;
        calibOffset.dy = calibSamples.reduce((a,b)=>a+b.dy,0)/calibSamples.length;
        calibDone = true;
        document.getElementById('m-calib').textContent = 'OK';
        showVoice('ROBO: calibrated!');
        addLog('Calibration complete — offset dx='+calibOffset.dx.toFixed(3)+' dy='+calibOffset.dy.toFixed(3), 'info');
      }
      overlay.classList.add('hidden');
      calibrating = false;
    }
  }, 1000);
}

// ── Tap-to-Talk ────────────────────────────────────────────────────────────
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showVoice('Voice not supported'); return; }
  rec = new SR();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = 'en-US';
  rec.onresult = (e) => {
    const t = e.results[0][0].transcript;
    showVoice('Heard: ' + t);
    addLog('VOICE: "' + t + '"', 'voice');
    parseVoice(t);
  };
  rec.onerror = (e) => {
    if (e.error !== 'no-speech') showVoice('Mic error: ' + e.error);
    stopTalkUI();
  };
  rec.onend = () => stopTalkUI();
}

function startTalk(e) {
  e.preventDefault();
  if (!rec || isRecording) return;
  isRecording = true;
  document.getElementById('talk-btn').classList.add('recording');
  document.getElementById('talk-btn').textContent = '🔴  LISTENING...';
  try { rec.start(); } catch(err) {}
}

function stopTalk(e) {
  e.preventDefault();
  if (!rec || !isRecording) return;
  try { rec.stop(); } catch(err) {}
  stopTalkUI();
}

function stopTalkUI() {
  isRecording = false;
  const btn = document.getElementById('talk-btn');
  btn.classList.remove('recording');
  btn.innerHTML = '<i class="ti ti-microphone" style="font-size:18px"></i> HOLD TO TALK';
}

// ── Logging System ─────────────────────────────────────────────────────────
const logs = [];
let sessionStart = null;

function logCmd(pan, tilt, locked, latency) {
  logs.push({
    t: Date.now() - sessionStart,
    pan, tilt, locked,
    latency,
    fps: frameCount,
    speed: speedMode
  });
}

function downloadLogs() {
  if (logs.length === 0) return;
  const sessionDuration = ((Date.now() - sessionStart) / 1000).toFixed(1);
  const latencies = logs.map(l => l.latency).filter(l => l > 0);
  const avgLatency = latencies.length ? (latencies.reduce((a,b)=>a+b,0)/latencies.length).toFixed(1) : 'N/A';
  const minLatency = latencies.length ? Math.min(...latencies) : 'N/A';
  const maxLatency = latencies.length ? Math.max(...latencies) : 'N/A';
  const avgFps = (logs.map(l=>l.fps).reduce((a,b)=>a+b,0)/logs.length).toFixed(1);
  const lockedCount = logs.filter(l=>l.locked).length;

  // Build CSV
  let csv = 'ROBO Session Log\n';
  csv += `Session Start,${new Date(sessionStart).toISOString()}\n`;
  csv += `Duration (s),${sessionDuration}\n`;
  csv += `Total Commands,${logs.length}\n`;
  csv += `Avg Latency (ms),${avgLatency}\n`;
  csv += `Min Latency (ms),${minLatency}\n`;
  csv += `Max Latency (ms),${maxLatency}\n`;
  csv += `Avg FPS,${avgFps}\n`;
  csv += `Locked Commands,${lockedCount}\n`;
  csv += '\n';
  csv += 'time_ms,pan,tilt,locked,latency_ms,fps,speed_mode\n';
  logs.forEach(l => {
    csv += `${l.t},${l.pan},${l.tilt},${l.locked},${l.latency},${l.fps},${l.speed}\n`;
  });

  // Auto download
  const blob = new Blob([csv], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `ROBO_log_${new Date(sessionStart).toISOString().slice(0,19).replace(/:/g,'-')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showVoice(`Log saved! ${logs.length} commands`);
}

// ── WebSocket ──────────────────────────────────────────────────────────────
function connectWS(ip) {
  try { ws = new WebSocket(`ws://${ip}:8765`); } catch(e) { return; }
  ws.onopen = () => {
    wsReady = true;
    sessionStart = Date.now();
    logs.length = 0;
    monitorStart = Date.now();
    document.getElementById('conn-dot').classList.add('on');
    pingStart = Date.now();
    ws.send(JSON.stringify({ping:true}));
    showVoice('ROBO online!');
    addLog('Connected to ESP32 at ' + ip, 'info');
    setTimeout(startCalibration, 800);
  };
  ws.onmessage = () => {
    const lat = Date.now()-pingStart;
    document.getElementById('m-ping').textContent = lat+'ms';
  };
  ws.onerror  = () => { addLog('Connection error', 'error'); };
  ws.onclose  = () => {
    wsReady=false; ws=null;
    document.getElementById('conn-dot').classList.remove('on');
    addLog('Disconnected — downloading log...', 'warn');
    downloadLogs();
  };
}

function sendCommand(pan, tilt, locked) {
  if (!wsReady||!ws) return;
  if (pan===lastPan&&tilt===lastTilt) return;
  lastPan=pan; lastTilt=tilt;
  const latency = Date.now() - pingStart;
  logCmd(pan, tilt, locked, latency);
  try { ws.send(JSON.stringify({pan,tilt,locked})); document.getElementById('m-sent').textContent=++sentCount; }
  catch(e){}
}

// ── Boot ───────────────────────────────────────────────────────────────────
function bootROBO() {
  const ip = document.getElementById('ip-input').value.trim();
  if (!ip) { alert('Enter the ESP32 IP address first.'); return; }
  const ws_el = document.getElementById('welcome-screen');
  ws_el.classList.add('hide');
  setTimeout(() => ws_el.style.display='none', 900);
  document.getElementById('control-ui').classList.add('show');
  connectWS(ip);
  startCamera();
  initSpeech();
  addLog('System booting — connecting to ' + ip, 'info');
}

// ── MediaPipe ──────────────────────────────────────────────────────────────
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

const hands = new Hands({ locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.6 });

hands.onResults(results => {
  frameCount++;
  canvas.width  = video.videoWidth  || canvas.offsetWidth;
  canvas.height = video.videoHeight || canvas.offsetHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
    setBadge('SHOW HANDS',''); return;
  }

  let panAngle  = currentPan;
  let tiltAngle = currentTilt;
  let leftFound = false, rightFound = false;

  results.multiHandLandmarks.forEach((lm, i) => {
    // MediaPipe handedness is mirrored for front camera
    // "Left" in results = user's Right hand, "Right" in results = user's Left hand
    const label = results.multiHandedness[i].label; // "Left" or "Right"
    const isUserLeft  = (label === 'Right'); // mirrored
    const isUserRight = (label === 'Left');  // mirrored

    // Draw skeleton — green for left, blue for right
    const color = isUserLeft ? '#00ffaa44' : '#0088ff44';
    const dotColor = isUserLeft ? '#00ffaa' : '#0088ff';
    drawConnectors(ctx, lm, HAND_CONNECTIONS, {color, lineWidth:2});
    drawLandmarks(ctx,  lm, {color: dotColor, lineWidth:1, radius:3});

    if (calibrating) {
      const wrist=lm[0], mcp=lm[5];
      calibSamples.push({dx: mcp.x-wrist.x, dy: mcp.y-wrist.y});
    }

    if (isLocked) return;

    const wrist=lm[0], mcp=lm[5];
    let dx = (mcp.x - wrist.x) - calibOffset.dx;
    let dy = (mcp.y - wrist.y) - calibOffset.dy;

    if (isUserLeft) {
      // LEFT hand → PAN only
      leftFound = true;
      dx *= speedMode;
      panAngle = clamp(90 + dx * 500, 0, 180);
    } else if (isUserRight) {
      // RIGHT hand → TILT only
      rightFound = true;
      dy *= speedMode;
      tiltAngle = clamp(90 - dy * 500, 0, 180);
    }
  });

  if (isLocked) { setBadge('LOCKED','locked'); return; }

  // Smooth each axis independently
  const sPan  = leftFound  ? clamp(smooth(panBuf,  panAngle),  0, 180) : currentPan;
  const sTilt = rightFound ? clamp(smooth(tiltBuf, tiltAngle), 0, 180) : currentTilt;

  currentPan  = sPan;
  currentTilt = sTilt;

  // Badge shows which hands detected
  const handStr = leftFound && rightFound ? 'L:PAN  R:TILT'
                : leftFound  ? 'LEFT → PAN'
                : rightFound ? 'RIGHT → TILT'
                : 'NO HAND';
  setBadge(`${handStr}  ${sPan}°/${sTilt}°`, 'active');
  updateGauges(sPan, sTilt);
  sendCommand(sPan, sTilt, false);
});

async function startCamera() {
  const attempts = [
    {video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}},
    {video:{width:{ideal:640},height:{ideal:480}}},
    {video:true}
  ];
  let stream=null;
  for (const c of attempts) {
    try { stream=await navigator.mediaDevices.getUserMedia(c); break; } catch(e){}
  }
  if (!stream) return;
  video.srcObject=stream;
  await new Promise(r=>{video.onloadedmetadata=r;});
  await video.play();
  const camera = new Camera(video, { onFrame: async()=>{ await hands.send({image:video}); }, width:640, height:480 });
  camera.start();
}
